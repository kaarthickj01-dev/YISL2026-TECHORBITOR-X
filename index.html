<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Tech Orbitors X - Control Portal</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script>
        // Custom component for button hover scale and page redirection
        AFRAME.registerComponent('nav-button', {
            schema: {
                url: { type: 'string', default: '' },
                baseColor: { type: 'color', default: '#121225' },
                hoverColor: { type: 'color', default: '#00ffff' }
            },
            init: function () {
                var el = this.el;
                var data = this.data;

                // Set initial color
                el.setAttribute('material', 'color', data.baseColor);

                // Hover Enter
                el.addEventListener('mouseenter', function () {
                    el.setAttribute('animation__hover', {
                        property: 'scale',
                        to: '1.08 1.08 1.08',
                        dur: 150,
                        easing: 'easeOutQuad'
                    });
                    el.setAttribute('material', 'emissive', data.hoverColor);
                    el.setAttribute('material', 'emissiveIntensity', 0.6);
                });

                // Hover Leave
                el.addEventListener('mouseleave', function () {
                    el.setAttribute('animation__hover', {
                        property: 'scale',
                        to: '1 1 1',
                        dur: 150,
                        easing: 'easeOutQuad'
                    });
                    el.setAttribute('material', 'emissive', '#000000');
                    el.setAttribute('material', 'emissiveIntensity', 0);
                });

                // Click to redirect
                el.addEventListener('click', function () {
                    el.setAttribute('animation__click', {
                        property: 'scale',
                        from: '0.9 0.9 0.9',
                        to: '1.08 1.08 1.08',
                        dur: 100,
                        easing: 'easeOutQuad'
                    });

                    if (data.url) {
                        setTimeout(function () {
                            window.location.href = data.url;
                        }, 300);
                    }
                });
            }
        });
    </script>
</head>

<body>
    <a-scene>
        <!-- Cyber grid environment background -->
        <a-sky color="#03030f"></a-sky>
        <a-plane position="0 -1.5 0" rotation="-90 0 0" width="30" height="30" color="#00ffff"
            material="wireframe: true; opacity: 0.1"></a-plane>

        <!-- Ambient decorative models representing both modes -->
        <!-- Driving mode icon decoration (Left) -->
        <a-entity position="-2 0.8 -3.5">
            <a-box width="0.8" height="0.3" depth="1.2" color="#ff5500"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                <a-box width="0.6" height="0.25" depth="0.6" position="0 0.25 -0.1" color="#111"></a-box>
            </a-box>
        </a-entity>

        <!-- Mechanical mode icon decoration (Right) -->
        <a-entity position="2 0.8 -3.5">
            <!-- Floating mechanical cog / cylinder -->
            <a-cylinder radius="0.4" height="0.2" color="#00ffcc" rotation="90 0 0"
                animation="property: rotation; to: 90 360 0; loop: true; dur: 8000; easing: linear">
                <a-cylinder radius="0.1" height="0.22" color="#111"></a-cylinder>
            </a-cylinder>
        </a-entity>

        <!-- Camera Rig with cursor for interaction -->
        <a-entity id="rig" position="0 0 0">
            <a-camera id="camera" look-controls wasd-controls>
                <a-cursor id="cursor" cursor="fuse: true; fuseTimeout: 1200"
                    material="color: #00ffff; shader: flat; opacity: 0.8"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025" raycaster="objects: .clickable"
                    animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1200; from: 1 1 1; to: 0.1 0.1 0.1"
                    animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                    animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 500; to: 1 1 1">
                </a-cursor>
            </a-camera>
        </a-entity>

        <!-- Futuristic Control Portal Panel -->
        <a-entity position="0 1.2 -2.5" rotation="-10 0 0">
            <!-- Glassmorphic Cyberpunk Panel Background -->
            <a-plane width="2.4" height="0.9" material="color: #0a0a1a; opacity: 0.92; roughness: 0.1; metalness: 0.8"
                class="panel"></a-plane>

            <!-- Glowing Neon Borders -->
            <a-plane width="2.42" height="0.015" position="0 0.45 0.005"
                material="color: #00ffff; shader: flat"></a-plane>
            <a-plane width="2.42" height="0.015" position="0 -0.45 0.005"
                material="color: #00ffff; shader: flat"></a-plane>
            <a-plane width="0.015" height="0.92" position="-1.21 0 0.005"
                material="color: #00ffff; shader: flat"></a-plane>
            <a-plane width="0.015" height="0.92" position="1.21 0 0.005"
                material="color: #00ffff; shader: flat"></a-plane>

            <!-- Control Board Header -->
            <a-text value="TECH ORBITORS X - PORTAL" align="center" position="0 0.3 0.01" scale="0.25 0.25 0.25"
                color="#00ffcc" font="mozillavr"></a-text>
            <a-text value="SELECT MISSION MODULE" align="center" position="0 0.18 0.01" scale="0.12 0.12 0.12"
                color="#8888aa" font="mozillavr"></a-text>

            <!-- Button 1: DRIVING MISSION (points to ../index.html) -->
            <a-entity position="-0.55 -0.15 0.01">
                <a-plane width="0.92" height="0.32" position="0 0 0" material="color: #ff0055; shader: flat"></a-plane>
                <a-box id="btn-driving" class="clickable" width="0.9" height="0.3" depth="0.04" position="0 0 0.01"
                    nav-button="url: index1.html; baseColor: #121225; hoverColor: #ff0055">
                    <a-text value="DRIVING MISSION" align="center" position="0 0 0.021" scale="0.16 0.16 0.16"
                        color="#ffffff" font="mozillavr"></a-text>
                </a-box>
            </a-entity>

            <!-- Button 2: MECHANICAL GARAGE (points to repair.html) -->
            <a-entity position="0.55 -0.15 0.01">
                <a-plane width="0.92" height="0.32" position="0 0 0" material="color: #00ffcc; shader: flat"></a-plane>
                <a-box id="btn-repair" class="clickable" width="0.9" height="0.3" depth="0.04" position="0 0 0.01"
                    nav-button="url: repair.html; baseColor: #121225; hoverColor: #00ffcc">
                    <a-text value="MECHANICAL GARAGE" align="center" position="0 0 0.021" scale="0.16 0.16 0.16"
                        color="#ffffff" font="mozillavr"></a-text>
                </a-box>
            </a-entity>
        </a-entity>

    </a-scene>
</body>

</html>
